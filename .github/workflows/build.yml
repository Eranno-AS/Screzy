name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Screzy.exe
          path: build/Screzy.exe
      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Screzy.exe

  msix:
    # Builds the Store package when the repository variables STORE_IDENTITY_NAME and
    # STORE_PUBLISHER are set (values from Partner Center > Product identity).
    needs: exe
    if: vars.STORE_IDENTITY_NAME != '' && vars.STORE_PUBLISHER != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Screzy.exe
          path: build
      - name: Pack MSIX
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { ($env:GITHUB_REF -replace 'refs/tags/v','') + '.0' } else { '1.0.0.0' }
          ./store/pack.ps1 -IdentityName '${{ vars.STORE_IDENTITY_NAME }}' -Publisher '${{ vars.STORE_PUBLISHER }}' -Version $ver
      - uses: actions/upload-artifact@v4
        with:
          name: Screzy-msix
          path: store/out/*.msix
