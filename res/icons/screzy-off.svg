<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A3A9B5"/>
      <stop offset="1" stop-color="#6B7280"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <!-- scroll wheel -->
  <rect x="20" y="8" width="24" height="48" rx="12" fill="#ffffff"/>
  <!-- notch, with fading copies trailing below = glide -->
  <rect x="27" y="14" width="10" height="14" rx="5" fill="#6B7280"/>
  <rect x="27" y="29" width="10" height="9"  rx="4.5" fill="#6B7280" opacity="0.45"/>
  <rect x="27" y="40" width="10" height="7"  rx="3.5" fill="#6B7280" opacity="0.2"/>
</svg>
